[package]
name = "ma-banque"
version = "0.2.1"
description = "Personal banking management app"
authors = ["Sebastien Viguier"]
license = "UNLICENSED"
repository = "https://github.com/SebEdena/ma-banque"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ma_banque_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
thiserror = "2.0.19"
anyhow = "1.0.104"
tauri-plugin-wdio = "1.3.0"
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3"
