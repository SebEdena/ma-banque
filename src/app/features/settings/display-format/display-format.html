<section class="flex flex-col">
  <div class="border-b pb-5">
    <h2 class="mb-2 text-[12.5px] font-semibold text-muted-foreground">
      Date · aperçu {{ exampleDate | dateFormat: displaySettings.dateFormat() }}
    </h2>
    <app-option-toggle-group
      [options]="dateFormatOptions"
      [active]="displaySettings.dateFormat()"
      (optionSelected)="selectDateFormat($event)"
    />
  </div>

  <div class="border-b py-5">
    <h2 class="mb-2 text-[12.5px] font-semibold text-muted-foreground">
      Monétaire · aperçu {{ exampleAmount | currencyFormat: displaySettings.currencyFormat() }}
    </h2>
    <app-option-toggle-group
      [options]="currencyFormatOptions"
      [active]="displaySettings.currencyFormat()"
      (optionSelected)="selectCurrencyFormat($event)"
    />
  </div>

  <div class="pt-5">
    <h2 class="mb-2 text-[12.5px] font-semibold text-muted-foreground">Thème</h2>
    <div class="flex gap-1 rounded-[10px] bg-muted p-1">
      @for (option of themeOptions; track option.value) {
        <button
          type="button"
          class="flex flex-1 items-center justify-center gap-1.5 rounded-lg py-2.5 text-[13px] font-semibold"
          [class]="{
            'bg-card text-foreground shadow-sm': theme.mode() === option.value,
            'text-muted-foreground': theme.mode() !== option.value,
          }"
          (click)="selectTheme(option.value)"
        >
          <ng-icon [name]="option.icon" size="15" />
          {{ option.label }}
        </button>
      }
    </div>
  </div>
</section>
