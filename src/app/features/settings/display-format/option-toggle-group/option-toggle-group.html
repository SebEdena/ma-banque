<div class="flex gap-1 rounded-[10px] bg-muted p-1">
  @for (option of options(); track option.value) {
    <button
      type="button"
      [attr.data-value]="option.value"
      class="flex-1 rounded-lg border border-transparent py-2 font-mono text-[13px] font-semibold outline-none transition-all focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:translate-y-px"
      [class]="{
        'bg-primary/10 text-primary': option.value === active(),
        'text-muted-foreground': option.value !== active(),
      }"
      [hlmTooltip]="option.tooltip ?? null"
      (click)="optionSelected.emit(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
