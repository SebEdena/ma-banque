<div class="flex flex-col gap-5 p-6 sm:p-9">
  <div class="flex flex-col gap-2">
    <span class="text-xs font-bold tracking-wide text-muted-foreground uppercase">
      Paramètres
    </span>
    <hlm-select class="w-full sm:w-64" [value]="section()" (valueChange)="selectSection($event)">
      <hlm-select-trigger data-testid="settings-section-select" class="w-full">
        <hlm-select-value />
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal class="w-[--radix-select-trigger-width]">
        @for (option of sectionOptions; track option.value) {
          <hlm-select-item
            [attr.data-testid]="'settings-section-option-' + option.value"
            [value]="option.value"
          >
            {{ option.label }}
          </hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>

    <!-- TEMPORARY demo link back to Home — see the class doc on `Settings`. -->
    <a
      routerLink="/home"
      class="flex w-fit items-center gap-1.5 text-[13.5px] text-muted-foreground underline hover:text-foreground"
    >
      <ng-icon name="lucideHouse" size="14" />
      Accueil
    </a>
  </div>
  <div class="min-w-0 rounded-2xl border bg-card p-6">
    <router-outlet />
  </div>
</div>
