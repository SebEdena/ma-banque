<section class="flex flex-col gap-4 p-6">
  <div>
    <h2 class="text-sm font-semibold">Emplacement actuel</h2>
    <p class="text-muted-foreground mt-1 text-sm">
      {{ currentFolder() ?? 'Aucun dossier configuré' }}
    </p>
  </div>

  <div class="flex flex-wrap gap-2">
    <button hlmBtn type="button" [disabled]="busy()" (click)="moveDataFolder()">
      Déplacer le dossier de données
    </button>
    <button hlmBtn type="button" variant="outline" [disabled]="busy()" (click)="openDataFolder()">
      Ouvrir un autre dossier
    </button>
  </div>
</section>
