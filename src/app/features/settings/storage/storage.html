<section>
  <h2 class="mb-1 text-[15px] font-bold">Emplacement du fichier de données</h2>
  <p class="mb-3.5 text-sm text-muted-foreground">
    L'ensemble de vos comptes, écritures et postes est stocké dans ce fichier local.
  </p>

  <div class="flex items-center gap-2.5 rounded-[10px] bg-muted px-3.5 py-2.5">
    <ng-icon name="lucideFolder" size="16" class="text-muted-foreground" />
    <span class="flex-1 overflow-hidden text-ellipsis whitespace-nowrap font-mono text-[13px]">
      {{ currentFolder() ?? 'Aucun dossier configuré' }}
    </span>
  </div>

  <div class="mt-3.5 flex flex-wrap gap-2">
    <button hlmBtn type="button" [disabled]="busy()" (click)="moveDataFolder()">
      Déplacer le dossier de données
    </button>
    <button hlmBtn type="button" variant="outline" [disabled]="busy()" (click)="openDataFolder()">
      Ouvrir un autre dossier
    </button>
  </div>
</section>
