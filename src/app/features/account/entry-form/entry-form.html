<button
  type="button"
  role="checkbox"
  data-testid="entry-form-reconciled"
  data-accent-solid
  [attr.aria-checked]="reconciled()"
  [attr.aria-label]="reconciled() ? 'Écriture pointée' : 'Écriture non pointée'"
  class="flex size-[19px] shrink-0 items-center justify-center rounded-md border-[1.5px] border-border text-white outline-none"
  [style.background-color]="reconciled() ? accountColor() : 'transparent'"
  [style.border-color]="reconciled() ? accountColor() : ''"
  (click)="reconciledToggled.emit()"
>
  @if (reconciled()) {
    <ng-icon name="lucideCheck" size="12" />
  }
</button>

<hlm-date-picker
  #dateField
  captionLayout="dropdown"
  [date]="draftDate()"
  [formatDate]="formatDraftDate()"
  (dateChange)="onDateChange($event)"
  class="w-[150px] shrink-0"
>
  <hlm-date-picker-input
    inputId="entry-form-date"
    data-accent
    aria-label="Date de l’écriture"
    calendarAriaLabel="Ouvrir le calendrier"
    clearAriaLabel="Effacer la date"
    [showClear]="false"
    [formatInputDate]="formatDraftDate()"
    [parseDate]="parseInputDate"
    class="text-[12.5px]"
  />
</hlm-date-picker>

<span
  class="flex w-[170px] shrink-0 items-center gap-2 rounded-[7px] border border-border bg-card px-1.5 py-1"
>
  <span
    class="flex size-6 shrink-0 items-center justify-center rounded-[7px] text-white"
    [style.background-color]="categorySwatch().color"
  >
    <ng-icon [name]="categorySwatch().icon" size="13" />
  </span>
  <hlm-select
    class="min-w-0 flex-1"
    [value]="categoryValue()"
    [itemToString]="categoryItemToString"
    (valueChange)="onCategoryChange($event)"
  >
    <hlm-select-trigger
      #categoryField
      [buttonId]="'entry-form-category'"
      data-testid="entry-form-category"
      data-accent
      aria-label="Poste de l’écriture"
      class="h-auto w-full border-none bg-transparent p-0 text-[12px] font-semibold shadow-none focus-visible:ring-0"
    >
      <hlm-select-value placeholder="Aucun poste" />
    </hlm-select-trigger>
    <hlm-select-content *hlmSelectPortal class="min-w-[210px] p-1">
      <hlm-select-item class="cursor-pointer font-semibold" [value]="null">
        <span
          class="flex size-[22px] shrink-0 items-center justify-center rounded-[6px] text-white"
          [style.background-color]="uncategorized.color"
        >
          <ng-icon [name]="uncategorized.icon" size="12" />
        </span>
        Aucun poste
      </hlm-select-item>
      @for (category of categories(); track category.id) {
        <hlm-select-item
          class="cursor-pointer font-semibold"
          [attr.data-testid]="'entry-form-category-option-' + category.id"
          [value]="category.id"
        >
          <span
            class="flex size-[22px] shrink-0 items-center justify-center rounded-[6px] text-white"
            [style.background-color]="category.color"
          >
            <ng-icon [name]="category.icon" size="12" />
          </span>
          {{ category.name }}
        </hlm-select-item>
      }
      <hlm-select-item
        class="cursor-pointer font-semibold"
        data-testid="entry-form-category-new"
        [value]="newCategoryValue"
      >
        <span
          class="flex size-[22px] shrink-0 items-center justify-center rounded-[6px] bg-emerald-600 text-white dark:bg-emerald-500"
        >
          <ng-icon name="lucidePlus" size="12" />
        </span>
        Nouvelle catégorie…
      </hlm-select-item>
    </hlm-select-content>
  </hlm-select>
</span>

<span class="flex min-w-0 flex-1 flex-col gap-1">
  <span class="flex items-center gap-2">
    <input
      #labelField
      id="entry-form-label"
      type="text"
      data-testid="entry-form-label"
      data-focus-inset
      placeholder="Libellé"
      aria-label="Libellé de l’écriture"
      class="min-w-0 flex-1 rounded-[7px] border border-border bg-card px-2 py-1 text-[13.5px] font-bold outline-none"
      [class.border-destructive]="labelError() !== null"
      [value]="draft().label"
      (input)="patch({ label: $any($event.target).value })"
    />
    @if (labelError(); as message) {
      <span
        data-testid="entry-form-label-error"
        class="shrink-0 text-[11px] font-semibold text-destructive"
      >
        {{ message }}
      </span>
    }
  </span>
  <input
    id="entry-form-description"
    type="text"
    data-testid="entry-form-description"
    data-focus-inset
    placeholder="Description (optionnel)"
    aria-label="Description de l’écriture"
    class="w-full rounded-[7px] border border-border bg-card px-2 py-0.5 text-[12px] text-muted-foreground outline-none"
    [value]="draft().description"
    (input)="patch({ description: $any($event.target).value })"
  />
</span>

<span class="flex shrink-0 flex-col items-end gap-1">
  <span class="flex items-center gap-1.5">
    <input
      #amountField
      id="entry-form-amount"
      type="number"
      step="0.01"
      inputmode="decimal"
      data-testid="entry-form-amount"
      data-accent
      placeholder="0,00"
      aria-label="Montant de l’écriture"
      class="w-[90px] rounded-[7px] border border-border bg-card px-2 py-1.5 text-right font-mono text-[14px] font-semibold outline-none"
      [class.border-destructive]="amountError() !== null"
      [value]="amountDisplay()"
      (focus)="amountEditing.set(true)"
      (blur)="amountEditing.set(false)"
      (input)="onAmountInput($any($event.target))"
    />
    <span class="flex gap-[3px]">
      <button
        type="button"
        data-testid="entry-form-debit"
        data-accent-solid
        [attr.data-selected]="isDebit()"
        [attr.aria-pressed]="isDebit()"
        class="rounded-md border px-1.5 py-1 text-[11px] font-semibold outline-none transition-colors"
        [class]="
          isDebit()
            ? 'border-destructive bg-destructive text-white'
            : 'border-border hover:border-destructive hover:text-destructive'
        "
        (click)="setDebit(true)"
      >
        Débit
      </button>
      <button
        type="button"
        data-testid="entry-form-credit"
        data-accent-solid
        [attr.data-selected]="!isDebit()"
        [attr.aria-pressed]="!isDebit()"
        class="rounded-md border px-1.5 py-1 text-[11px] font-semibold outline-none transition-colors"
        [class]="
          isDebit()
            ? 'border-border hover:border-emerald-600 hover:text-emerald-600 dark:hover:border-emerald-400 dark:hover:text-emerald-400'
            : 'border-emerald-600 bg-emerald-600 text-white dark:border-emerald-500 dark:bg-emerald-500'
        "
        (click)="setDebit(false)"
      >
        Crédit
      </button>
    </span>
  </span>
  @if (amountError(); as message) {
    <span
      data-testid="entry-form-amount-error"
      class="text-[11px] font-semibold whitespace-nowrap text-destructive"
    >
      {{ message }}
    </span>
  }
</span>

<span class="flex w-16 shrink-0 items-center justify-end gap-1">
  <button
    type="button"
    data-testid="entry-save"
    data-accent-solid
    hlmTooltip="Enregistrer"
    aria-label="Enregistrer l’écriture"
    class="flex size-7 items-center justify-center rounded-lg bg-emerald-600 text-white outline-none transition-colors hover:bg-emerald-700 disabled:opacity-50 dark:bg-emerald-500 dark:hover:bg-emerald-600"
    [disabled]="saving()"
    (click)="attemptSave(); $event.stopPropagation()"
  >
    <ng-icon name="lucideCheck" size="14" />
  </button>
  <button
    type="button"
    data-testid="entry-cancel"
    data-accent-solid
    hlmTooltip="Annuler"
    aria-label="Annuler la modification"
    class="flex size-7 items-center justify-center rounded-lg bg-destructive/10 text-destructive outline-none transition-colors hover:bg-destructive hover:text-white"
    (click)="cancelled.emit(); $event.stopPropagation()"
  >
    <ng-icon name="lucideX" size="14" />
  </button>
</span>
