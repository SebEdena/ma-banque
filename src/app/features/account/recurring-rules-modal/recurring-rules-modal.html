<app-modal-shell
  labelledBy="recurring-rules-title"
  panelClass="max-w-[640px]"
  (dismissed)="closed.emit()"
>
  <div data-testid="recurring-modal" [style.--account-color]="accountColor()">
    <div class="mb-4 flex items-center gap-2.5">
      <span
        class="flex size-8 shrink-0 items-center justify-center rounded-[10px] text-white"
        [style.background-color]="accountColor()"
      >
        <ng-icon name="lucideCalendarClock" size="16" />
      </span>
      <h2 id="recurring-rules-title" class="flex-1 text-[15px] font-bold">Écritures périodiques</h2>
      @if (editing() === null) {
        <button
          type="button"
          data-testid="recurring-new"
          data-accent-solid
          class="flex items-center gap-1.5 rounded-[9px] px-3 py-2 text-[13px] font-semibold text-white outline-none"
          [style.background-color]="accountColor()"
          (click)="startCreate()"
        >
          <ng-icon name="lucidePlus" size="15" />
          Nouvelle règle
        </button>
      }
    </div>

    @if (editing() === null) {
      <app-recurring-rule-list
        [rules]="rules()"
        [categories]="categories()"
        [currencyFormat]="currencyFormat()"
        [dateFormat]="dateFormat()"
        (edit)="startEdit($event)"
        (delete)="confirmingDelete.set($event)"
      />
    } @else {
      <app-recurring-rule-form
        [(draft)]="draft"
        [categories]="categories()"
        [saving]="saving()"
        (saved)="onFormSaved($event)"
        (cancelled)="backToList()"
      />
    }
  </div>
</app-modal-shell>

@if (confirmingDelete(); as rule) {
  <app-confirm-dialog
    title="Supprimer l’écriture périodique"
    [message]="
      '« ' +
      rule.label +
      ' » ne générera plus rien. Les écritures déjà générées restent dans le compte.'
    "
    confirmLabel="Supprimer"
    (confirmed)="confirmDelete()"
    (cancelled)="confirmingDelete.set(null)"
  />
}

@if (awaitingScope() !== null) {
  <app-modal-shell
    labelledBy="recurring-scope-title"
    panelClass="max-w-sm"
    (dismissed)="awaitingScope.set(null)"
  >
    <div data-testid="recurring-scope-dialog" [style.--account-color]="accountColor()">
      <h2 id="recurring-scope-title" class="mb-2 text-[15px] font-bold">
        Appliquer la modification
      </h2>
      <p class="mb-4 text-sm text-muted-foreground">
        Cette modification porte sur l’écriture générée. À quelles occurrences doit-elle s’appliquer
        ?
      </p>

      <div class="flex flex-col gap-2">
        <button
          type="button"
          data-testid="recurring-scope-next"
          data-accent
          class="rounded-[10px] border border-border px-3 py-2.5 text-left text-sm font-semibold outline-none transition-colors"
          (click)="applyScope('NEXT_OCCURRENCE_ONLY')"
        >
          Uniquement la prochaine occurrence
        </button>
        <button
          type="button"
          data-testid="recurring-scope-all"
          data-accent-solid
          class="rounded-[10px] px-3 py-2.5 text-left text-sm font-semibold text-white outline-none"
          [style.background-color]="accountColor()"
          (click)="applyScope('ALL_FUTURE')"
        >
          La prochaine et toutes les suivantes
        </button>
        <button
          hlmBtn
          type="button"
          variant="outline"
          class="mt-1"
          data-testid="recurring-scope-cancel"
          (click)="awaitingScope.set(null)"
        >
          Annuler
        </button>
      </div>
    </div>
  </app-modal-shell>
}
