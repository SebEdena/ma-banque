@if (account(); as account) {
  <div class="flex h-full flex-col" [style.--account-color]="account.color">
    <header class="mb-5 flex flex-wrap items-center gap-3">
      <h1 class="text-2xl font-extrabold tracking-tight">Statistiques</h1>

      <div class="flex-1"></div>

      <button
        type="button"
        data-testid="view-account-button"
        data-accent
        [routerLink]="['/account', account.id]"
        class="flex items-center gap-1.5 rounded-[9px] border border-border bg-card px-3 py-2 text-[13px] font-semibold text-muted-foreground outline-none transition-colors"
      >
        <ng-icon name="lucideWallet" size="14" />
        Voir le compte
      </button>

      <div class="flex gap-1.5 rounded-[10px] bg-muted p-1" data-testid="period-control">
        @for (item of periods; track item.preset) {
          <button
            type="button"
            [attr.data-testid]="'period-' + item.preset"
            [attr.aria-pressed]="selectedPeriod() === item.preset"
            class="rounded-[8px] px-3 py-1.5 text-[13px] font-semibold outline-none transition-colors"
            [class]="
              selectedPeriod() === item.preset
                ? 'text-white'
                : 'text-muted-foreground hover:text-foreground'
            "
            [style.background-color]="selectedPeriod() === item.preset ? account.color : ''"
            (click)="selectPeriod(item.preset)"
          >
            {{ item.label }}
          </button>
        }
      </div>
    </header>

    <app-account-pills
      class="mb-6"
      [accounts]="accounts()"
      [selectedAccountId]="accountId()"
      (accountSelected)="selectAccount($event)"
    />

    <div class="grid gap-5 lg:grid-cols-2">
      <app-breakdown-chart
        [buckets]="buckets()"
        [total]="total()"
        [loaded]="loaded()"
        [currencyFormat]="displaySettings.currencyFormat()"
        title="Répartition des dépenses par poste"
        emptyMessage="Aucune dépense sur cette période."
        centralSubLabel="Total dépenses"
      />

      <app-breakdown-chart
        [buckets]="creditBuckets()"
        [total]="totalCredits()"
        [loaded]="loaded()"
        [currencyFormat]="displaySettings.currencyFormat()"
        title="Répartition des recettes par poste"
        emptyMessage="Aucune recette sur cette période."
        centralSubLabel="Total recettes"
        testIdPrefix="credit-"
      />
    </div>

    <app-monthly-chart
      class="mt-5 block"
      [months]="months()"
      [dateFormat]="displaySettings.dateFormat()"
      [currencyFormat]="displaySettings.currencyFormat()"
    />
  </div>
}
