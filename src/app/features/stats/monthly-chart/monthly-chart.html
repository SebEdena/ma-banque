<section
  data-testid="monthly-card"
  class="rounded-[18px] border border-border bg-card p-6 shadow-sm"
>
  <div class="mb-4.5 flex items-center justify-between">
    <h2 class="text-[15px] font-bold">Recettes / Dépenses par mois</h2>
    <div class="flex gap-3.5 text-xs text-muted-foreground" data-testid="monthly-legend">
      @for (series of monthSeries; track series.label) {
        <span class="flex items-center gap-1.5">
          <span class="size-2.5 rounded-[3px]" [style.background-color]="series.color"></span>
          {{ series.label }}
        </span>
      }
    </div>
  </div>

  <vis-xy-container data-testid="monthly-chart" [data]="months()" [height]="220">
    <vis-grouped-bar [x]="monthX" [y]="monthY" [color]="monthColor" />
    <vis-axis
      type="y"
      data-testid="monthly-y-axis"
      [numTicks]="4"
      [tickFormat]="monthYAxisTickFormat"
    />
    <vis-axis type="x" [tickValues]="monthTickValues()" [tickFormat]="monthAxisTickFormat" />
    <vis-tooltip [triggers]="monthTooltipTriggers" />
  </vis-xy-container>
</section>
