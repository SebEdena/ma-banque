<aside
  class="flex h-full w-[76px] shrink-0 flex-col items-center gap-3 bg-[#14161f] py-4"
  aria-label="Navigation principale"
>
  <a
    routerLink="/home"
    routerLinkActive
    #homeActive="routerLinkActive"
    data-testid="sidebar-home"
    aria-label="Accueil"
    class="flex size-11 items-center justify-center rounded-[14px] outline-none transition-all focus-visible:ring-3 focus-visible:ring-ring/50"
    [class]="
      homeActive.isActive
        ? 'bg-[#5850ec] text-white'
        : 'bg-[#1d202c] text-white/70 hover:bg-[#262a3a]'
    "
  >
    <ng-icon name="lucideHouse" size="19" />
  </a>

  <hr class="my-0.5 w-[30px] border-white/[0.14]" />

  <nav class="flex flex-1 flex-col items-center gap-2.5 overflow-y-auto px-2" aria-label="Comptes">
    @for (account of activeAccounts(); track account.id) {
      <a
        data-testid="sidebar-account"
        [attr.data-account-id]="account.id"
        [routerLink]="['/account', account.id]"
        routerLinkActive="ring-2 ring-white ring-offset-2 ring-offset-[#14161f]"
        [attr.aria-label]="account.name"
        [attr.title]="account.name"
        [style.background-color]="account.color"
        class="flex size-11 items-center justify-center rounded-[14px] text-white outline-none transition-all focus-visible:ring-3 focus-visible:ring-ring/50"
      >
        <ng-icon [name]="account.icon" size="19" />
      </a>
    }
  </nav>

  <a
    routerLink="/settings"
    routerLinkActive
    #settingsActive="routerLinkActive"
    data-testid="sidebar-settings"
    aria-label="Réglages"
    class="flex size-11 items-center justify-center rounded-[14px] outline-none transition-all focus-visible:ring-3 focus-visible:ring-ring/50"
    [class]="
      settingsActive.isActive
        ? 'bg-[#5850ec] text-white'
        : 'bg-[#1d202c] text-white/70 hover:bg-[#262a3a]'
    "
  >
    <ng-icon name="lucideSettings" size="19" />
  </a>
</aside>
