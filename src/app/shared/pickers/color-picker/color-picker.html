<div class="flex flex-wrap gap-2" role="group" aria-label="Couleur">
  @for (swatch of swatches; track swatch.value) {
    <button
      type="button"
      data-testid="color-swatch"
      [attr.data-value]="swatch.value"
      [attr.aria-label]="swatch.label"
      [attr.aria-pressed]="swatch.value === value()"
      [style.background-color]="swatch.value"
      class="size-[26px] rounded-lg border-2 shadow-sm outline-none transition-all focus-visible:ring-3 focus-visible:ring-ring/50 active:translate-y-px"
      [class.border-foreground]="swatch.value === value()"
      [class.border-transparent]="swatch.value !== value()"
      (click)="selected.emit(swatch.value)"
    ></button>
  }
</div>
