name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    name: Bump version and tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.compute-version.outputs.version }}
    steps:
      - name: Require running from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must be run from main, not ${{ github.ref }}."
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          # actions/setup-node's built-in `cache: npm` keys solely on the
          # lockfile hash, with no restore-keys fallback — since `npm
          # version` (below) rewrites package.json/package-lock.json's
          # version field on every run, that hash changes every single
          # time, discarding the whole npm cache instead of reusing the
          # untouched dependency tree. The restore-keys prefix here falls
          # back to the nearest previous cache so npm only fetches the
          # true delta.
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Compute new version
        id: compute-version
        run: |
          current=$(jq -r .version src-tauri/tauri.conf.json)
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="$major.$minor.$patch"
          echo "Bumping $current -> $new_version (${{ inputs.bump }})"
          echo "NEW_VERSION=$new_version" >> "$GITHUB_ENV"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Update tauri.conf.json
        run: |
          jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
      - name: Update Cargo.toml
        run: |
          sed -i "0,/^version = /s/^version = .*/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
      - name: Update Cargo.lock
        working-directory: src-tauri
        run: cargo update -p ma-banque --precise "$NEW_VERSION"
      - name: Update package.json / package-lock.json
        run: npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ env.NEW_VERSION }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and tag
        run: |
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "chore(release): bump version to v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "v$NEW_VERSION"
          git push origin main --follow-tags

  warm-release-cache:
    name: Warm release build cache
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release-src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          # See the same step in the bump-version job: the lockfile
          # `npm version` just bumped changes the hash every run, so a
          # restore-keys fallback is needed to reuse the untouched
          # dependency tree instead of a full re-download.
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: cargo build --release
        working-directory: src-tauri
        run: cargo build --release

  trigger-release:
    name: Trigger release build
    needs: [bump-version, warm-release-cache]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release workflow
        env:
          # A dispatch made with the default GITHUB_TOKEN gets its permissions
          # capped to read-only on the triggered run, regardless of that
          # workflow's own `permissions:` block — release.yml's release
          # creation then fails with "Resource not accessible by integration".
          # A PAT avoids that cap.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v${{ needs.bump-version.outputs.new_version }}"
