name: Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build the release from
        required: false
        type: string

jobs:
  release:
    name: Build installer and draft release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          # git-cliff (below) needs the full tag/commit history to render
          # the release notes; the default shallow clone only has the tip.
          fetch-depth: 0
      - name: Generate release notes
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release-src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          # actions/setup-node's built-in `cache: npm` keys solely on the
          # lockfile hash, with no restore-keys fallback — bump-version.yml
          # changes that hash on every release (it bumps package.json's
          # version right before tagging), so a bare lockfile-hash key
          # would discard the whole npm cache instead of reusing the
          # untouched dependency tree. The restore-keys prefix falls back
          # to the nearest previous cache so npm only fetches the delta.
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          # The auto-generated GITHUB_TOKEN has intermittently lacked
          # release-creation rights on this repo despite contents: write
          # being declared here (fails with "Resource not accessible by
          # integration"). RELEASE_TOKEN is a PAT with Contents: write,
          # used to sidestep that.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Signs the bundle and makes tauri-action emit latest.json (the
          # in-app updater's manifest) as a release asset.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Ma Banque ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.release-notes.outputs.content }}
          releaseDraft: false
          prerelease: false
          projectPath: src-tauri
