name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build installer and draft release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache cargo-installed CLI tools
        id: cargo-tools-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-cargo-tools-tauri-cli-2-v1
      - name: Install tauri-cli
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ma Banque ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
