name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build installer and draft release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release-src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          # actions/setup-node's built-in `cache: npm` keys solely on the
          # lockfile hash, with no restore-keys fallback — bump-version.yml
          # changes that hash on every release (it bumps package.json's
          # version right before tagging), so a bare lockfile-hash key
          # would discard the whole npm cache instead of reusing the
          # untouched dependency tree. The restore-keys prefix falls back
          # to the nearest previous cache so npm only fetches the delta.
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - uses: tauri-apps/tauri-action@v2
        env:
          # The auto-generated GITHUB_TOKEN has intermittently lacked
          # release-creation rights on this repo despite contents: write
          # being declared here (fails with "Resource not accessible by
          # integration"). RELEASE_TOKEN is a PAT with Contents: write,
          # used to sidestep that.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ma Banque ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
