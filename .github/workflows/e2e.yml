name: E2E

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'src-tauri/**'
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'wdio.conf.ts'
              - 'angular.json'
              - 'tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/e2e.yml'

  e2e:
    name: WebdriverIO smoke test
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Shared with ci.yml's rust-windows-build job so both jobs reuse the
          # same Windows target/ dir instead of each compiling src-tauri from
          # scratch and caching a separate ~1GB copy of it.
          shared-key: windows-src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache cargo-installed CLI tools
        id: cargo-tools-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/tauri-driver.exe
            ~/.cargo/bin/msedgedriver-tool.exe
          key: windows-cargo-tools-tauri-driver-msedgedriver-tool-v2
      - name: Install tauri-driver
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - name: Install msedgedriver-tool
        if: steps.cargo-tools-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/chippers/msedgedriver-tool
      - name: Download msedgedriver matching the runner's WebView2/Edge version
        run: |
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Build debug binary (no bundle)
        # src-tauri/tauri.e2e.conf.json overrides beforeBuildCommand to build
        # the frontend with Angular's development configuration instead of
        # the default production one. That flips isDevMode() true, which is
        # what gates loading @wdio/tauri-plugin in src/main.ts — without this
        # the e2e run would build the same frontend bundle as a release, and
        # the plugin (along with tauri_plugin_wdio's execute()/mock() API)
        # would never activate.
        run: npm run tauri:build:e2e
      - name: Work around WebView2 150 elevated-host remote-debugging-port regression
        # windows-latest runners execute elevated (admin). WebView2 Runtime 150
        # deliberately ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS and HKCU policy
        # for elevated host processes (confirmed "by design" security hardening), which
        # breaks tauri-driver/msedgedriver's CDP handshake ("DevToolsActivePort file
        # doesn't exist" / session-creation timeout). Only an HKLM policy survives
        # elevation, so set it here for the app binary until wry passes the debug port
        # via the WebView2 API directly.
        # See https://github.com/MicrosoftEdge/WebView2Feedback/issues/5640 and
        # https://github.com/tauri-apps/wry/issues/1782 (upstream fix pending).
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments' -Name 'ma-banque.exe' -Value '--remote-debugging-port=0'
      - name: Run e2e suite
        run: npm run e2e
